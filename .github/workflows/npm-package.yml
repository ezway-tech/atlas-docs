name: npm package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - name: Verify pinned 5.1.0 fixture checksum
        run: |
          set -euo pipefail
          file=release-artifacts/atlas-docs-5.1.0.tgz
          sum=release-artifacts/atlas-docs-5.1.0.tgz.sha256
          test -f "$file"
          test -f "$sum"
          expected=$(awk '{print tolower($1)}' "$sum")
          actual=$(sha256sum "$file" | awk '{print tolower($1)}')
          test "$actual" = "$expected"
      - run: npm run check:distribution
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: |
            dist/*.tgz
            dist/*.sha256
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist
      - name: Verify pinned 5.1.0 fixture checksum
        shell: bash
        run: |
          set -euo pipefail
          file=release-artifacts/atlas-docs-5.1.0.tgz
          sum=release-artifacts/atlas-docs-5.1.0.tgz.sha256
          test -f "$file"
          test -f "$sum"
          expected=$(awk '{print tolower($1)}' "$sum")
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum "$file" | awk '{print tolower($1)}')
          else
            actual=$(shasum -a 256 "$file" | awk '{print tolower($1)}')
          fi
          test "$actual" = "$expected"
      - run: npm run test:package
      - run: npm run test:upgrade-artifacts
        env:
          ATLAS_TEST_OLD_TARBALL: release-artifacts/atlas-docs-5.1.0.tgz
          ATLAS_TEST_OLD_TARBALL_SHA256: release-artifacts/atlas-docs-5.1.0.tgz.sha256
  release-candidate:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist
      - name: Print release-candidate checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          for f in dist/*.tgz.sha256; do
            echo "=== $f ==="
            cat "$f"
            echo
            tgz="${f%.sha256}"
            expected=$(awk '{print tolower($1)}' "$f")
            actual=$(sha256sum "$tgz" | awk '{print tolower($1)}')
            test "$actual" = "$expected"
            echo "Verified $tgz sha256=$actual"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error
