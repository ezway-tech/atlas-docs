services:
  atlas-docs:
    build:
      context: ${ATLAS_REPO_ROOT}
      dockerfile: app/Dockerfile
    ports:
      - 127.0.0.1:17440:3000
    environment:
      ATLAS_LIBRARY_MODE: manager
      ATLAS_LIBRARIES_ROOT: /libraries
      ATLAS_DOCS_LIBRARIES_DIR: /libraries
      ATLAS_DOCS_REGISTRY_DIR: /atlas-registry
      ATLAS_DOCS_ALLOWED_ROOTS: /libraries
      ATLAS_DOCS_UPGRADE_BACKUP_DIR: /upgrade-backups
      NODE_ENV: production
    volumes:
      - ${SMOKE_DIR}/libraries:/libraries
      - ${SMOKE_DIR}/atlas-registry:/atlas-registry
      - ${SMOKE_DIR}/upgrade-backups:/upgrade-backups
