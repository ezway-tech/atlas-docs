services:
  atlas-docs:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATA_DIR: /data
      NODE_ENV: production
      ATLAS_DOCS_UPGRADE_BACKUP_DIR: /upgrade-backups
    volumes:
      - ./data:/data
      - ./.atlas-docs-upgrade-backups:/upgrade-backups
    restart: unless-stopped
