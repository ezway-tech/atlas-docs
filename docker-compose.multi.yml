# Opt-in multi-library Compose for source builds.
# Libraries live under ./libraries; recent list under ./atlas-registry.
# Switching libraries restarts the in-container runtime only — not the container.
# Do not rely on /data: the image default DATA_DIR=/data is ignored in manager mode
# (that path is not mounted here). Optional: set ATLAS_OPEN_LIBRARY to a path under
# /libraries to open one library at startup.
#
#   docker compose -f docker-compose.multi.yml up --build
#
# Host folders must be mounted first. The app cannot browse arbitrary host paths.

services:
  atlas-docs:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ATLAS_LIBRARY_MODE: manager
      ATLAS_LIBRARIES_ROOT: /libraries
      ATLAS_DOCS_LIBRARIES_DIR: /libraries
      ATLAS_DOCS_REGISTRY_DIR: /atlas-registry
      ATLAS_DOCS_ALLOWED_ROOTS: /libraries
      ATLAS_DOCS_UPGRADE_BACKUP_DIR: /upgrade-backups
      NODE_ENV: production
    volumes:
      - ./libraries:/libraries
      - ./atlas-registry:/atlas-registry
      - ./.atlas-docs-upgrade-backups:/upgrade-backups
    restart: unless-stopped
